[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-localization-agent"
version = "0.2.0"
description = "A LangGraph experiment agent for robust BLE crowdsourced localization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0,<3",
  "openai>=1.0,<4",
  "python-dotenv>=1.0,<2",
  "langgraph>=1.0,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pydantic>=2.0,<3",
  "reportlab>=4.0,<6",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
