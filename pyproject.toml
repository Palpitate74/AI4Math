[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-localization-agent"
version = "0.1.0"
description = "A LangGraph experiment agent for robust BLE crowdsourced localization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.12.1",
  "langgraph>=1.2.14",
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "pydantic>=2.14.0",
  "reportlab>=5.0.1",
  "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
